<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>AETimeTracker</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="lib/CSInterface.js"></script>
        <script src="main.js"></script>
    </head>
    <body>
        <div id="container">
            <div id="saveWarning" class="warning">
                Make sure to save to track properly!
            </div>
            <div class="group">
                <div class="label"> Session Timer </div>
                <div id="sessionTimer" class="timer">00:00:00</div>
            </div>
            <div class="group">
                <div class="label"> Total Time </div>
                <div id="overallTimer" class="timer">00:00:00</div>
            </div>
        </div>
    </body>
</html>
